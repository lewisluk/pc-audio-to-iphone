<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PC ↔ iPhone audio</title>
<style>
  /* Strict monochrome: pure #000 background (true black on OLED), pure #fff
     ink. Secondary text is white at reduced opacity — no colors anywhere. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  main { text-align: center; padding: 24px; }
  h1 {
    font-size: 1rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    color: #fff; opacity: 0.55; margin: 0 0 1.8rem;
  }
  /* Segmented LISTEN / MIC toggle. */
  #modes {
    display: inline-flex; border: 2px solid #fff; border-radius: 999px;
    overflow: hidden; margin-bottom: 1.6rem;
  }
  .mode {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.7em 1.1em; background: #000; color: #fff; border: none;
    touch-action: manipulation;
  }
  .mode[aria-selected="true"] { background: #fff; color: #000; }
  #hint { margin: 0 0 1.8rem; min-height: 1.2em; color: #fff; opacity: 0.5; font-size: 0.85rem; }
  #start {
    font-size: 1.4rem; font-weight: 700; letter-spacing: 0.1em; padding: 1.1em 2.8em;
    border: 2px solid #fff; border-radius: 999px; background: #fff; color: #000;
    touch-action: manipulation;
  }
  #start:disabled { background: #000; color: #fff; opacity: 0.4; }
  #status { margin-top: 2.2rem; min-height: 1.4em; color: #fff; font-size: 1rem; }
  #stats {
    margin-top: 0.5rem; min-height: 1.2em; color: #fff; opacity: 0.45;
    font-size: 0.85rem; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<main>
  <h1>AirPods WiFi Bridge</h1>
  <div id="modes" role="tablist">
    <button class="mode" id="mode-listen" role="tab" aria-selected="true">Listen</button>
    <button class="mode" id="mode-mic" role="tab" aria-selected="false">Mic</button>
    <button class="mode" id="mode-both" role="tab" aria-selected="false">Both</button>
  </div>
  <p id="hint"></p>
  <button id="start">START</button>
  <p id="status">Tap Start to connect</p>
  <p id="stats"></p>
  <!-- iOS route workaround: when the mic is live (Mic/Both mode), iOS
       switches the audio session to "call" and routes <audio> playback to
       the earpiece. A <video> element keeps the media route (loudspeaker),
       so the stream plays through a 1-px transparent video instead.
       playsinline + autoplay: sound still only starts after the user-gesture
       unlock performed inside the Start click handler (iOS Safari policy). -->
  <video id="player" autoplay playsinline
         style="width:1px;height:1px;opacity:0.01;position:fixed;top:0;left:0;pointer-events:none;"></video>
</main>

<script>
"use strict";
const startBtn = document.getElementById("start");
const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");
const hintEl = document.getElementById("hint");
const player = document.getElementById("player");
const modeListenBtn = document.getElementById("mode-listen");
const modeMicBtn = document.getElementById("mode-mic");
const modeBothBtn = document.getElementById("mode-both");

let pc = null;
let micStream = null;
let statsTimer = null;
let prevInbound = null;
let prevOutbound = null;
let mode = "listen";  // "listen" = PC->AirPods, "mic" = phone mic -> PC,
                      // "both" = duplex (hear the PC while the mic feeds it)

function setStatus(text) { statusEl.textContent = text; }

// Mic capture (getUserMedia) needs a secure context: served over https:// or
// localhost. Loaded over plain http://LAN-IP the browser hides the mic API, so
// tell the user to switch to the https URL rather than failing cryptically.
const micSupported = window.isSecureContext &&
  !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

function refreshHint() {
  if (mode === "listen") {
    hintEl.textContent = "Play this PC's audio through your AirPods.";
  } else if (mode === "both") {
    hintEl.textContent = micSupported
      ? "Two-way: hear the PC while your iPhone's mic feeds it."
      : "Both needs the https:// address — reopen this page there.";
  } else if (micSupported) {
    hintEl.textContent = "Use your iPhone's microphone as a PC input.";
  } else {
    hintEl.textContent = "Mic needs the https:// address — reopen this page there.";
  }
}

function selectMode(next) {
  if (pc) return;  // don't switch mid-session
  mode = next;
  modeListenBtn.setAttribute("aria-selected", String(next === "listen"));
  modeMicBtn.setAttribute("aria-selected", String(next === "mic"));
  modeBothBtn.setAttribute("aria-selected", String(next === "both"));
  refreshHint();
}

modeListenBtn.addEventListener("click", () => selectMode("listen"));
modeMicBtn.addEventListener("click", () => selectMode("mic"));
modeBothBtn.addEventListener("click", () => selectMode("both"));

// Live diagnostics. Listen/Both read the receive jitter buffer (the browser's
// share of total delay); Mic/Both read the outbound packet rate so you can see
// the mic is actually sending (~50 pkt/s at 20 ms ptime).
function startStats() {
  stopStats();
  statsTimer = setInterval(async () => {
    if (!pc || pc.connectionState !== "connected") return;
    const report = await pc.getStats();
    let bufferMs = null, sentRate = null;
    report.forEach((entry) => {
      if (entry.kind !== "audio") return;
      if (entry.type === "inbound-rtp" && (mode === "listen" || mode === "both")) {
        if (prevInbound && prevInbound.id === entry.id &&
            entry.jitterBufferDelay !== undefined) {
          const delay = entry.jitterBufferDelay - prevInbound.jitterBufferDelay;
          const count = entry.jitterBufferEmittedCount - prevInbound.jitterBufferEmittedCount;
          if (count > 0) bufferMs = Math.round((delay / count) * 1000);
        }
        prevInbound = entry;
      } else if (entry.type === "outbound-rtp" && (mode === "mic" || mode === "both")) {
        if (prevOutbound && prevOutbound.id === entry.id &&
            entry.packetsSent !== undefined) {
          sentRate = entry.packetsSent - prevOutbound.packetsSent;
        }
        prevOutbound = entry;
      }
    });
    const parts = [];
    if (bufferMs !== null) parts.push("buffer " + bufferMs + " ms");
    if (sentRate !== null) parts.push("sending " + sentRate + " pkt/s");
    if (parts.length) statsEl.textContent = parts.join(" · ");
  }, 1000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  prevInbound = null;
  prevOutbound = null;
  statsEl.textContent = "";
}

// The server expects a complete (non-trickle) offer in a single POST, so wait
// until ICE gathering finishes. LAN host candidates gather near-instantly.
function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

function cleanup() {
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (pc) { pc.close(); pc = null; }
  if (player) { try { player.pause(); player.srcObject = null; } catch (e) {} }
  // Release the audio session back to plain playback, otherwise iOS keeps it
  // in play-and-record and the next Listen session comes out of the earpiece
  // at degraded quality. Two writes, no delay needed (WebKit bug 282939).
  if (navigator.audioSession) {
    try { navigator.audioSession.type = "playback"; } catch (e) {}
    try { navigator.audioSession.type = "auto"; } catch (e) {}
  }
}

// Listen has no microphone, so nothing forces the play-and-record category —
// but iOS clings to that category after a Both/Mic session (we set it
// explicitly for the route kick) and would drag Listen into call mode with the
// capped call-volume slider. Declaring 'playback' here kicks the session back
// to media routing, independent of whatever ran before.
function requestMediaSession() {
  if (!navigator.audioSession) return;
  try { navigator.audioSession.type = "playback"; } catch (e) {}
}

// Ask the OS for the mic, then re-declare the audio session as play-and-record.
// Native apps set AVAudioSession .defaultToSpeaker here; the web has no such
// option, and WebKit's implicit category routes our playback to the earpiece.
// Setting the type explicitly *after* getUserMedia is the documented kick that
// makes iOS re-evaluate the route (WebKit bug 282939) - the ordering matters:
// setting it before getUserMedia succeeds only about half the time.
async function getMicWithRouteKick() {
  const session = navigator.audioSession;
  if (session) { try { session.type = "auto"; } catch (e) {} }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
  });
  if (session) { try { session.type = "play-and-record"; } catch (e) {} }
  return stream;
}

async function start() {
  startBtn.disabled = true;
  modeListenBtn.disabled = modeMicBtn.disabled = modeBothBtn.disabled = true;
  setStatus("Connecting…");

  // Same-LAN only: host candidates are enough, no STUN/TURN servers needed.
  pc = new RTCPeerConnection({ iceServers: [] });
  const endpoint = mode === "mic" ? "/mic-offer" : "/offer";

  try {
    if (mode === "listen" || mode === "both") {
      // Listen must never inherit a stale play-and-record session from an
      // earlier Both/Mic run (that is what caps it at call volume).
      if (mode === "listen") requestMediaSession();

      // Unlock audio while still inside the click gesture: iOS Safari only
      // honors .play() calls traceable to a user interaction. Playing the
      // (empty) element now grants playback for the stream arriving later.
      player.play().catch(() => {});

      // Speaker transceiver FIRST: the server attaches its loopback track to
      // the first transceiver it can send on (recvonly), so ordering here
      // deterministically pairs directions in the Both offer.
      const transceiver = pc.addTransceiver("audio", { direction: "recvonly" });
      // LATENCY KNOB: ask for the minimum receive jitter buffer (0 = as low as
      // the browser dares; it keeps an internal floor and adapts up on bad WiFi).
      const receiver = transceiver.receiver;
      try { if ("playoutDelayHint" in receiver) receiver.playoutDelayHint = 0; } catch (e) {}
      try { if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = 0; } catch (e) {}

      pc.addEventListener("track", (evt) => {
        player.srcObject = evt.streams[0];
        // Re-assert the media session once real audio arrives: iOS may
        // re-evaluate the category when playback starts.
        if (mode === "listen") requestMediaSession();
        player.play().catch(() => setStatus("Audio blocked — tap Start again"));
      });

      if (mode === "both") {
        if (!micSupported) throw new Error("mic needs the https:// address");
        // Raw-ish mic (no echo cancellation - not a call), noise suppression +
        // auto gain on so it works as a general PC microphone. The helper also
        // kicks the iOS audio session so playback stays on the loudspeaker.
        micStream = await getMicWithRouteKick();
        for (const micTrack of micStream.getAudioTracks()) {
          pc.addTransceiver(micTrack, { direction: "sendonly" });
        }
      }
    } else {
      if (!micSupported) throw new Error("mic needs the https:// address");
      micStream = await getMicWithRouteKick();
      for (const track of micStream.getAudioTracks()) {
        pc.addTransceiver(track, { direction: "sendonly" });
      }
    }
  } catch (err) {
    setStatus("Error: " + err.message);
    startBtn.disabled = false;
    modeListenBtn.disabled = modeMicBtn.disabled = modeBothBtn.disabled = false;
    cleanup();
    return;
  }

  pc.addEventListener("connectionstatechange", () => {
    if (pc.connectionState === "connected") {
      setStatus(mode === "listen"
        ? "Streaming — keep this page open & screen on"
        : mode === "both"
          ? "Two-way live — keep this page open & screen on"
          : "Mic live — keep this page open & screen on");
      startStats();
    } else if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      setStatus("Disconnected — tap Start to reconnect");
      startBtn.disabled = false;
      modeListenBtn.disabled = modeMicBtn.disabled = modeBothBtn.disabled = false;
      stopStats();
      cleanup();
    } else {
      setStatus("Connection: " + pc.connectionState);
    }
  });

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await waitForIceGathering(pc);
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (!response.ok) throw new Error("signaling failed (HTTP " + response.status + ")");
    await pc.setRemoteDescription(await response.json());
  } catch (err) {
    setStatus("Error: " + err.message);
    startBtn.disabled = false;
    modeListenBtn.disabled = modeMicBtn.disabled = false;
    stopStats();
    cleanup();
    return;
  }

  // Best effort: keep the screen awake. iOS suspends Safari (and this session)
  // when the phone locks or the tab goes to background.
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
}

startBtn.addEventListener("click", start);
refreshHint();
</script>
</body>
</html>
